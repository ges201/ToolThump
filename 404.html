<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>404 — toolthump</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/global_css/theme.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            text-align: center;
        }

        .code { font-size: 4rem; color: var(--red); margin-bottom: var(--spacing-sm); }
        .err::before { content: 'sh: '; color: var(--cyan); }
        .err { color: var(--yellow); margin-bottom: var(--spacing-sm); }
        p { color: var(--fg-dim); margin-bottom: var(--spacing-xl); }
        a { color: var(--cyan); }
    </style>
</head>

<body>

    <script>
        const path = window.location.pathname;
        const redirects = {
            '/about.html': '/pages/about.html',
            '/privacy.html': '/pages/privacy.html',
            '/tools/text/duplicate-word-finder/duplicate-word-finder.html': '/tools/text/duplicate-words-finder/duplicate-words-finder.html'
        };
        if (redirects[path]) { window.location.replace('https://toolthump.com' + redirects[path]); }
    </script>

    <div>
        <div class="code">404</div>
        <div class="err">this page: no such file or directory</div>
        <p>the tools are still here, though:</p>
        <a href="/">back to toolthump</a>
    </div>

</body>

</html>
